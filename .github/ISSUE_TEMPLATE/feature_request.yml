name: Feature request
description: Suggest an improvement or a new model provider
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow you are trying to do, not just the feature you want.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: layer
    attributes:
      label: Which layer would this touch?
      options:
        - apps/web (UI)
        - apps/desktop (Electron shell)
        - packages/ai-providers (model adapters)
        - packages/media-core (video processing)
        - services/api (HTTP service)
        - deployment / packaging
        - not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: checkboxes
    id: extra
    attributes:
      label: Additional context
      options:
        - label: This would also be useful for the hosted (proprietary) service
        - label: This affects the open-core / licensing boundary
