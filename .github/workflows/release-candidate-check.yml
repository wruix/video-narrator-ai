# 发布候选检查（非正式 Release，只构建+诊断+上传制品）
# 不创建 GitHub Release、不创建 tag、不推送代码。
# 权限最小化：contents: read，不写公开资源。
# 所有 build step 统一使用 shell: bash（GitHub Runner 全平台均可用 Git Bash）。
name: Release Candidate Check

on:
  # 安全候选构建入口：仅匹配 release-candidate/** 分支的 push 触发
  # 不监听正式 v* tag，不会触发 release.yml 的公开发布 job。
  # 该分支仅用于候选验证，验证完成后删除，不影响默认分支。
  push:
    branches:
      - "release-candidate/**"
  # 手动触发入口（文件已存在于远端默认分支后生效）
  workflow_dispatch:
    inputs:
      skip_macos_intel:
        description: "跳过 macOS Intel x64（Runner 标签不可用时）"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      skip_macos_arm:
        description: "跳过 macOS Apple Silicon arm64"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

jobs:
  # ==================================================================
  # 各平台候选构建
  # ==================================================================
  candidate-build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: "Windows-x64"
            platform: win
            arch_filter: "x86_64"
            eb_target: "nsis:x64 portable:x64"
          - os: macos-15-intel
            label: "macOS-Intel-x64"
            platform: mac
            arch_filter: "x86_64"
            eb_target: "dmg:x64 zip:x64"
          - os: macos-15
            label: "macOS-AppleSilicon-arm64"
            platform: mac
            arch_filter: "arm64"
            eb_target: "dmg:arm64 zip:arm64"
          - os: ubuntu-latest
            label: "Linux-x64"
            platform: linux
            arch_filter: "x86_64"
            eb_target: "AppImage:x64 deb:x64"

    # 通过 workflow_dispatch input 动态控制哪些平台跳过
    # 各 FFmpeg 下载步骤用 if: 检查 matrix.arch_filter 来区分目标架构
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，便于记录 commit

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      # --------------------------------------------------------------
      # 记录 Runner 实际架构信息
      # --------------------------------------------------------------
      - name: Record Runner info
        shell: bash
        run: |
          ARCH=$(uname -m 2>/dev/null || echo "x86_64")
          echo "runner_os=${{ runner.os }}" >> "$GITHUB_ENV"
          echo "runner_arch=$ARCH" >> "$GITHUB_ENV"
          echo "runner_label=${{ matrix.label }}" >> "$GITHUB_ENV"
          echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "git_short=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          # 架构一致性断言
          if [ "${{ matrix.platform }}" = "mac" ] && [ "${{ matrix.arch_filter }}" = "arm64" ] && [ "$ARCH" != "arm64" ]; then
            echo "::error::macOS ARM64 Runner 架构不符：实际=$ARCH，期望=arm64"
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "mac" ] && [ "${{ matrix.arch_filter }}" = "x86_64" ] && [ "$ARCH" != "x86_64" ]; then
            echo "::error::macOS Intel x64 Runner 架构不符：实际=$ARCH，期望=x86_64"
            exit 1
          fi
          echo "Runner: ${{ runner.os }} $ARCH, commit=$git_commit, label=${{ matrix.label }}"

      # --------------------------------------------------------------
      # FFmpeg 下载与 SHA-256 校验
      # 每个平台有独立步骤，arch_filter 决定下载哪组资产
      # --------------------------------------------------------------

      # Windows x64 — Gyan.dev 9.0.2
      - name: Download & verify FFmpeg (Windows x64)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          FFMPEG_DIR="$GITHUB_WORKSPACE/services/api/ffmpeg-bin"
          mkdir -p "$FFMPEG_DIR"
          TMP="$RUNNER_TEMP"
          echo "Downloading Gyan.dev FFmpeg 9.0.2 essentials..."
          curl -sL -o "$TMP/ffmpeg-essentials.zip" \
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          EXPECTED="60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          # 使用标准输入重定向：避免 Git Bash 的 GNU sha256sum 对反斜杠路径
          # ($RUNNER_TEMP) 启用文件名转义，导致哈希字段被粘连前导反斜杠。
          ACTUAL=$(sha256sum < "$TMP/ffmpeg-essentials.zip" | awk '{print $1}')
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          # 严格断言：实际值必须恰好是 64 位十六进制（比较前不删除任何字符）
          if ! printf '%s' "$ACTUAL" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::FFmpeg SHA-256 格式非法（应为 64 位十六进制）：'$ACTUAL'"
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::FFmpeg SHA-256 不匹配！"
            exit 1
          fi
          unzip -q "$TMP/ffmpeg-essentials.zip" -d "$TMP/ffmpeg-bin"
          # Gyan.dev 包结构：ffmpeg-<ver>-<arch>/bin/ffmpeg.exe
          BIN_DIR=$(find "$TMP/ffmpeg-bin" -type f -name "ffmpeg.exe" -exec dirname {} \; | head -1)
          if [ -z "$BIN_DIR" ]; then
            echo "::error::未在 ZIP 中找到 ffmpeg.exe"
            exit 1
          fi
          cp "$BIN_DIR/ffmpeg.exe"  "$FFMPEG_DIR/ffmpeg.exe"
          cp "$BIN_DIR/ffprobe.exe" "$FFMPEG_DIR/ffprobe.exe"
          echo "=== FFmpeg buildconf ==="
          "$FFMPEG_DIR/ffmpeg.exe" -buildconf 2>&1 | tee "$GITHUB_WORKSPACE/ffmpeg-bin-buildconf.txt"
          echo "=== FFprobe version ==="
          "$FFMPEG_DIR/ffprobe.exe" -version | head -1

      # macOS x64 — Martin Riedl 9.0.2（Intel）
      - name: Download & verify FFmpeg (macOS x64)
        if: matrix.platform == 'mac' && matrix.arch_filter == 'x86_64'
        shell: bash
        run: |
          FFMPEG_DIR="$GITHUB_WORKSPACE/services/api/ffmpeg-bin"
          mkdir -p "$FFMPEG_DIR"
          TMP="$RUNNER_TEMP"
          echo "Downloading Martin Riedl FFmpeg 9.0.2 macOS x64..."
          curl -sL -o "$TMP/ffmpeg.zip" \
            "https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2/ffmpeg.zip"
          F_EXP="7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4"
          F_ACT=$(shasum -a 256 "$TMP/ffmpeg.zip" | awk '{print $1}')
          echo "FFmpeg  expected: $F_EXP"
          echo "FFmpeg  actual:   $F_ACT"
          if [ "$F_ACT" != "$F_EXP" ]; then echo "::error::FFmpeg SHA-256 mismatch"; exit 1; fi
          curl -sL -o "$TMP/ffprobe.zip" \
            "https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2/ffprobe.zip"
          P_EXP="2322438ed2f6319a691291b247d09c69dcaa3a982460d1f269a7e1af335cfdfd"
          P_ACT=$(shasum -a 256 "$TMP/ffprobe.zip" | awk '{print $1}')
          echo "FFprobe expected: $P_EXP"
          echo "FFprobe actual:   $P_ACT"
          if [ "$P_ACT" != "$P_EXP" ]; then echo "::error::FFprobe SHA-256 mismatch"; exit 1; fi
          # Martin Riedl macOS ZIP 结构：直接含 ffmpeg / ffprobe 可执行文件
          unzip -q "$TMP/ffmpeg.zip"  -d "$TMP/ffmpeg-bin"
          unzip -q "$TMP/ffprobe.zip" -d "$TMP/ffprobe-bin"
          install -m 0755 "$TMP/ffmpeg-bin/ffmpeg"  "$FFMPEG_DIR/ffmpeg"
          install -m 0755 "$TMP/ffprobe-bin/ffprobe" "$FFMPEG_DIR/ffprobe"
          echo "=== FFprobe version ==="
          "$FFMPEG_DIR/ffprobe" -version | head -1
          echo "=== FFmpeg buildconf ==="
          "$FFMPEG_DIR/ffmpeg" -buildconf 2>&1 | tee "$GITHUB_WORKSPACE/ffmpeg-bin-buildconf.txt"

      # macOS arm64 — Martin Riedl 9.0.2（Apple Silicon）
      - name: Download & verify FFmpeg (macOS arm64)
        if: matrix.platform == 'mac' && matrix.arch_filter == 'arm64'
        shell: bash
        run: |
          FFMPEG_DIR="$GITHUB_WORKSPACE/services/api/ffmpeg-bin"
          mkdir -p "$FFMPEG_DIR"
          TMP="$RUNNER_TEMP"
          echo "Downloading Martin Riedl FFmpeg 9.0.2 macOS arm64..."
          curl -sL -o "$TMP/ffmpeg.zip" \
            "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip"
          F_EXP="c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924"
          F_ACT=$(shasum -a 256 "$TMP/ffmpeg.zip" | awk '{print $1}')
          echo "FFmpeg  expected: $F_EXP"
          echo "FFmpeg  actual:   $F_ACT"
          if [ "$F_ACT" != "$F_EXP" ]; then echo "::error::FFmpeg SHA-256 mismatch"; exit 1; fi
          curl -sL -o "$TMP/ffprobe.zip" \
            "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffprobe.zip"
          P_EXP="fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6"
          P_ACT=$(shasum -a 256 "$TMP/ffprobe.zip" | awk '{print $1}')
          echo "FFprobe expected: $P_EXP"
          echo "FFprobe actual:   $P_ACT"
          if [ "$P_ACT" != "$P_EXP" ]; then echo "::error::FFprobe SHA-256 mismatch"; exit 1; fi
          unzip -q "$TMP/ffmpeg.zip"  -d "$TMP/ffmpeg-bin"
          unzip -q "$TMP/ffprobe.zip" -d "$TMP/ffprobe-bin"
          install -m 0755 "$TMP/ffmpeg-bin/ffmpeg"  "$FFMPEG_DIR/ffmpeg"
          install -m 0755 "$TMP/ffprobe-bin/ffprobe" "$FFMPEG_DIR/ffprobe"
          echo "=== FFprobe version ==="
          "$FFMPEG_DIR/ffprobe" -version | head -1
          echo "=== FFmpeg buildconf ==="
          "$FFMPEG_DIR/ffmpeg" -buildconf 2>&1 | tee "$GITHUB_WORKSPACE/ffmpeg-bin-buildconf.txt"

      # Linux x64 — Martin Riedl 9.0.2
      - name: Download & verify FFmpeg (Linux x64)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          FFMPEG_DIR="$GITHUB_WORKSPACE/services/api/ffmpeg-bin"
          mkdir -p "$FFMPEG_DIR"
          TMP="$RUNNER_TEMP"
          echo "Downloading Martin Riedl FFmpeg 9.0.2 Linux x64..."
          curl -sL -o "$TMP/ffmpeg.zip" \
            "https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2/ffmpeg.zip"
          F_EXP="fa8ecf4abbd290d98f7d188b8649cc6b391ae209a98452be955a15aab1909d7f"
          F_ACT=$(sha256sum "$TMP/ffmpeg.zip" | awk '{print $1}')
          echo "FFmpeg  expected: $F_EXP"
          echo "FFmpeg  actual:   $F_ACT"
          if [ "$F_ACT" != "$F_EXP" ]; then echo "::error::FFmpeg SHA-256 mismatch"; exit 1; fi
          curl -sL -o "$TMP/ffprobe.zip" \
            "https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2/ffprobe.zip"
          P_EXP="3f428c49070be3d24ec338602b76d412e401ffcb8a5641ef0e729181a232fc32"
          P_ACT=$(sha256sum "$TMP/ffprobe.zip" | awk '{print $1}')
          echo "FFprobe expected: $P_EXP"
          echo "FFprobe actual:   $P_ACT"
          if [ "$P_ACT" != "$P_EXP" ]; then echo "::error::FFprobe SHA-256 mismatch"; exit 1; fi
          mkdir -p "$TMP/ffmpeg-bin" "$TMP/ffprobe-bin"
          unzip -q "$TMP/ffmpeg.zip"  -d "$TMP/ffmpeg-bin"
          unzip -q "$TMP/ffprobe.zip" -d "$TMP/ffprobe-bin"
          install -m 0755 "$TMP/ffmpeg-bin/ffmpeg"  "$FFMPEG_DIR/ffmpeg"
          install -m 0755 "$TMP/ffprobe-bin/ffprobe" "$FFMPEG_DIR/ffprobe"
          echo "=== FFprobe version ==="
          "$FFMPEG_DIR/ffprobe" -version | head -1
          echo "=== FFmpeg buildconf ==="
          "$FFMPEG_DIR/ffmpeg" -buildconf 2>&1 | tee "$GITHUB_WORKSPACE/ffmpeg-bin-buildconf.txt"

      # --------------------------------------------------------------
      # 安装依赖
      # --------------------------------------------------------------
      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # --------------------------------------------------------------
      # 构建（依赖顺序：web → electron → PyInstaller）
      # --------------------------------------------------------------
      - name: Build web assets
        run: npm run build:web

      - name: Build Electron desktop (TypeScript)
        run: npm run build:desktop

      - name: Build standalone server (PyInstaller)
        working-directory: services/api
        run: python -m PyInstaller --clean --noconfirm server.spec

      # --------------------------------------------------------------
      # 媒体自检（打包前，验证 FFmpeg 实际可用）
      # --------------------------------------------------------------
      - name: Media self-check (pre-packaging)
        shell: bash
        run: |
          set -e
          # 定位 FFmpeg（Windows 带 .exe 后缀）
          if [ "${{ matrix.platform }}" = "win" ]; then
            FFMPEG="$GITHUB_WORKSPACE/services/api/ffmpeg-bin/ffmpeg.exe"
            FFPROBE="$GITHUB_WORKSPACE/services/api/ffmpeg-bin/ffprobe.exe"
          else
            FFMPEG="$GITHUB_WORKSPACE/services/api/ffmpeg-bin/ffmpeg"
            FFPROBE="$GITHUB_WORKSPACE/services/api/ffmpeg-bin/ffprobe"
          fi

          echo "=== FFmpeg version ==="
          "$FFMPEG" -version | head -1

          echo "=== FFprobe version ==="
          "$FFPROBE" -version | head -1

          # 生成测试视频（3s, 320x240, h264+aac）
          TEST_DIR="$GITHUB_WORKSPACE/tests-ffmpeg-selfcheck"
          mkdir -p "$TEST_DIR"
          echo "=== Generating test video ==="
          "$FFMPEG" -y -f lavfi -i "testsrc=duration=3:size=320x240:rate=25" \
                    -f lavfi -i "sine=frequency=440:duration=3" \
                    -c:v libx264 -c:a aac -shortest "$TEST_DIR/test-input.mp4" 2>&1 | tail -5

          echo "=== FFprobe stream info (test-input.mp4) ==="
          "$FFPROBE" -v error -show_format -show_streams "$TEST_DIR/test-input.mp4" 2>&1 | head -30

          echo "=== FFmpeg re-encode to test-output.mp4 ==="
          "$FFMPEG" -y -i "$TEST_DIR/test-input.mp4" \
                    -c:v libx264 -c:a aac "$TEST_DIR/test-output.mp4" 2>&1 | tail -5

          OUT_SIZE=$(stat -f%z "$TEST_DIR/test-output.mp4" 2>/dev/null || stat -c%s "$TEST_DIR/test-output.mp4")
          echo "=== Output size: $OUT_SIZE bytes ==="
          if [ "$OUT_SIZE" -lt 1000 ]; then
            echo "::error::输出文件过小（<1000 字节），FFmpeg 可能未正确执行"
            exit 1
          fi

          echo "=== FFprobe re-read output ==="
          "$FFPROBE" -v error -show_format "$TEST_DIR/test-output.mp4" 2>&1 | head -5

      # --------------------------------------------------------------
      # electron-builder 预检（只读，非致命）：在 runner 现场固化证据，绝不阻断打包步骤。
      # 真实失败一律保留在 Package desktop app 步骤本身（保持原始退出码）。
      # 与打包完全同一解析路径：从 builder-util/out/util.js 出发，按它消费 app-builder-bin 的方式解析。
      # --------------------------------------------------------------
      - name: Preflight check app-builder-bin (read-only)
        shell: bash
        working-directory: apps/desktop
        run: |
          # RA-26 错误隔离：GitHub Actions 对 bash 步骤默认追加 -e -o pipefail。
          # 预检是只读取证，任何工具失败（含 ldd 对静态 ELF 的预期非零、
          # 管道 SIGPIPE、快照内命令非零）都不得终止本步骤、跳过 Package。
          # Package 步骤自身的 set -e 与失败语义完全不受影响。
          set +e
          set +o pipefail
          echo "=== runtime environment ==="
          node -e "console.log('process.platform=%s process.arch=%s execPath=%s', process.platform, process.arch, process.execPath)"
          echo "uname: $(uname -s) $(uname -m)"
          echo "node: $(command -v node)"
          echo "cwd: $(pwd)"
          echo ""
          echo "=== electron-builder toolchain (resolved from current cwd) ==="
          node -e "console.log('electron-builder :', require('electron-builder/package.json').version)" 2>/dev/null || echo "electron-builder : UNRESOLVABLE"
          node -e "console.log('app-builder-lib  :', require('app-builder-lib/package.json').version)" 2>/dev/null || echo "app-builder-lib  : UNRESOLVABLE"
          BU=$(node -e "console.log(require.resolve('builder-util/out/util.js'))" 2>/dev/null)
          echo "builder-util entry: ${BU:-UNRESOLVABLE}"
          ABB_PKG=""
          AB_BIN=""
          ABB_DIR=""
          if [ -n "$BU" ]; then
            node -e "console.log('builder-util     :', require('builder-util/package.json').version)" 2>/dev/null || echo "builder-util     : UNRESOLVABLE"
            ABB_PKG=$(node -e "console.log(require.resolve('app-builder-bin/package.json',{paths:[require('path').dirname(process.argv[1])]}))" "$BU" 2>/dev/null)
            AB_BIN=$(node -e "console.log(require(require.resolve('app-builder-bin',{paths:[require('path').dirname(process.argv[1])]})).appBuilderPath)" "$BU" 2>/dev/null)
            ABB_DIR=$(node -e "console.log(require('path').dirname(process.argv[1]))" "$ABB_PKG" 2>/dev/null)
          fi
          echo "app-builder-bin package: ${ABB_PKG:-UNRESOLVABLE}"
          node -e "console.log('app-builder-bin ver :', require(process.argv[1]).version)" "$ABB_PKG" 2>/dev/null || echo "app-builder-bin ver : UNRESOLVABLE"
          echo "electron installed ver: $(node -e "console.log(require('electron/package.json').version)" 2>/dev/null || echo UNRESOLVABLE)"
          echo "path electron-builder actually consumes: ${AB_BIN:-UNRESOLVABLE}"
          echo ""
          echo "=== snapshot: state before build ==="
          OUT="$RUNNER_TEMP/app-builder-bin.before"
          TOOL_OT="$RUNNER_TEMP/app-builder-bin.otool.out"
          TOOL_LD="$RUNNER_TEMP/app-builder-bin.ldd.out"
          TOOL_RE="$RUNNER_TEMP/app-builder-bin.readelf.out"
          TOOL_HP="$RUNNER_TEMP/app-builder-bin.help.out"
          {
            echo "ab_bin=${AB_BIN:-UNRESOLVABLE}"
            if [ -n "$AB_BIN" ] && [ -e "$AB_BIN" ]; then
              echo "exists=yes"
              echo "exec_bit=$([ -x "$AB_BIN" ] && echo yes || echo no)"
              echo "size=$(wc -c < "$AB_BIN")"
              ls -la "$AB_BIN"
              if command -v file >/dev/null 2>&1; then echo "file-type: $(file -b "$AB_BIN")"; else echo "file-type: (file tool unavailable)"; fi
              if [ "$(uname -s)" = "Darwin" ]; then
                if command -v otool >/dev/null 2>&1; then
                  # RA-26：工具输出先落盘再截取，避免 "| head" 在 -o pipefail 下被 SIGPIPE 判失败
                  otool -L "$AB_BIN" >"$TOOL_OT" 2>&1
                  echo "otool_rc=$?"
                  head -20 "$TOOL_OT"
                else
                  echo "otool: unavailable"
                fi
              fi
              if [ "$(uname -s)" = "Linux" ]; then
                if command -v ldd >/dev/null 2>&1; then
                  # RA-26：静态链接 ELF 上 ldd 返回非零属预期（"not a dynamic executable"），
                  # 记录返回码而不是让 pipefail 杀死诊断
                  ldd "$AB_BIN" >"$TOOL_LD" 2>&1
                  echo "ldd_rc=$? (non-zero expected for statically linked binaries)"
                  head -20 "$TOOL_LD"
                else
                  echo "ldd: unavailable"
                fi
                if command -v readelf >/dev/null 2>&1; then
                  readelf -lW "$AB_BIN" >"$TOOL_RE" 2>&1
                  echo "readelf_rc=$?"
                  head -30 "$TOOL_RE"
                else
                  echo "readelf: unavailable"
                fi
              fi
              "$AB_BIN" --help >"$TOOL_HP" 2>&1
              echo "standalone_help_rc=$?"
              echo "--- help output (first 1200 bytes) ---"
              head -c 1200 "$TOOL_HP"
            else
              echo "exists=no"
              if [ -n "$ABB_DIR" ]; then
                ls -la "$ABB_DIR/mac" "$ABB_DIR/linux" "$ABB_DIR/win" 2>/dev/null
                find "$ABB_DIR" -type f 2>/dev/null | sort
              fi
            fi
          } > "$OUT" 2>&1
          cat "$OUT"
          echo ""
          echo "(preflight is read-only non-fatal diagnostics only; true failures are preserved in the Package step itself)"
          exit 0

      # --------------------------------------------------------------
      # electron-builder 打包（显式目标 :架构 + --publish never 确保不发布）
      # 关键：CLI 的 --x64/--arm64 无法覆盖配置文件 mac.target.arch: [x64, arm64]
      # （见 app-builder-lib/out/targets/targetFactory.js computeArchToTargetNamesMap：
      #  配置文件 target 显式声明 arch 时优先于 CLI 架构开关），
      # 因此这里用 "target:arch" 形式强制单架构目标：
      #   Windows → nsis:x64 portable:x64
      #   Intel   → dmg:x64 zip:x64
      #   arm64   → dmg:arm64 zip:arm64
      #   Linux   → AppImage:x64 deb:x64
      # --------------------------------------------------------------
      - name: Package desktop app (electron-builder)
        shell: bash
        working-directory: apps/desktop
        run: |
          set -e
          # shellcheck disable=SC2086
          npx electron-builder --${{ matrix.platform }} ${{ matrix.eb_target }} --publish never

      # --------------------------------------------------------------
      # 构建后诊断（if: always()，只读，非致命）：
      # 用与构建完全相同的解析方式重查同一路径，并与构建前快照 diff。
      # 本步骤自身绝不失败，不改变打包步骤的退出码结论。
      #   - 构建前存在可启动、构建后消失  → 调查构建期间的依赖安装行为
      #   - 始终存在但无法启动            → 调查文件格式/架构/系统依赖
      #   - 前后解析路径不同              → 调查运行时包解析与工作目录
      # --------------------------------------------------------------
      - name: Post-build app-builder diagnostics (read-only)
        if: always()
        shell: bash
        working-directory: apps/desktop
        run: |
          # RA-26 错误隔离：同预检，set +e / set +o pipefail 让任何诊断命令失败
          # 只被记录、不改变步骤退出码；本步骤绝不覆盖 Package 的结论。
          set +e
          set +o pipefail
          echo "=== snapshot: state after packaging step (if: always()) ==="
          BU=$(node -e "console.log(require.resolve('builder-util/out/util.js'))" 2>/dev/null)
          AB_BIN=""
          ABB_PKG=""
          ABB_DIR=""
          if [ -n "$BU" ]; then
            ABB_PKG=$(node -e "console.log(require.resolve('app-builder-bin/package.json',{paths:[require('path').dirname(process.argv[1])]}))" "$BU" 2>/dev/null)
            AB_BIN=$(node -e "console.log(require(require.resolve('app-builder-bin',{paths:[require('path').dirname(process.argv[1])]})).appBuilderPath)" "$BU" 2>/dev/null)
            ABB_DIR=$(node -e "console.log(require('path').dirname(process.argv[1]))" "$ABB_PKG" 2>/dev/null)
          fi
          BEFORE="$RUNNER_TEMP/app-builder-bin.before"
          # RA-26：打包期 npm 生产安装可能剪除工具链（RA-25B 实证），打包后解析可能
          # 失败。此时回读构建前快照记录的字面路径，对该路径做只读事后复查，
          # 保证 "构建后文件是否存在" 不依赖工具链本身是否还解析得出来。
          RESOLUTION_MODE="resolve"
          EFFECTIVE="$AB_BIN"
          if [ -z "$EFFECTIVE" ]; then
            if [ -f "$BEFORE" ]; then
              RECALL_BIN=$(sed -n 's/^ab_bin=//p' "$BEFORE" | head -1)
              if [ -n "$RECALL_BIN" ] && [ "$RECALL_BIN" != "UNRESOLVABLE" ]; then
                EFFECTIVE="$RECALL_BIN"
                RESOLUTION_MODE="recall-from-before-snapshot (post-build toolchain resolution failed)"
              fi
            fi
          fi
          OUT="$RUNNER_TEMP/app-builder-bin.after"
          TOOL_OT="$RUNNER_TEMP/app-builder-bin.otool.after.out"
          TOOL_LD="$RUNNER_TEMP/app-builder-bin.ldd.after.out"
          TOOL_RE="$RUNNER_TEMP/app-builder-bin.readelf.after.out"
          TOOL_HP="$RUNNER_TEMP/app-builder-bin.help.after.out"
          {
            echo "resolution_mode=$RESOLUTION_MODE"
            echo "ab_bin=${EFFECTIVE:-UNRESOLVABLE}"
            if [ -n "$EFFECTIVE" ] && [ -e "$EFFECTIVE" ]; then
              echo "exists=yes"
              echo "exec_bit=$([ -x "$EFFECTIVE" ] && echo yes || echo no)"
              echo "size=$(wc -c < "$EFFECTIVE")"
              ls -la "$EFFECTIVE"
              if command -v file >/dev/null 2>&1; then echo "file-type: $(file -b "$EFFECTIVE")"; else echo "file-type: (file tool unavailable)"; fi
              if [ "$(uname -s)" = "Darwin" ]; then
                if command -v otool >/dev/null 2>&1; then
                  otool -L "$EFFECTIVE" >"$TOOL_OT" 2>&1
                  echo "otool_rc=$?"
                  head -20 "$TOOL_OT"
                else
                  echo "otool: unavailable"
                fi
              fi
              if [ "$(uname -s)" = "Linux" ]; then
                if command -v ldd >/dev/null 2>&1; then
                  ldd "$EFFECTIVE" >"$TOOL_LD" 2>&1
                  echo "ldd_rc=$? (non-zero expected for statically linked binaries)"
                  head -20 "$TOOL_LD"
                else
                  echo "ldd: unavailable"
                fi
                if command -v readelf >/dev/null 2>&1; then
                  readelf -lW "$EFFECTIVE" >"$TOOL_RE" 2>&1
                  echo "readelf_rc=$?"
                  head -30 "$TOOL_RE"
                else
                  echo "readelf: unavailable"
                fi
              fi
              "$EFFECTIVE" --help >"$TOOL_HP" 2>&1
              echo "standalone_help_rc=$?"
              echo "--- help output (first 1200 bytes) ---"
              head -c 1200 "$TOOL_HP"
            else
              echo "exists=no"
              if [ -n "$EFFECTIVE" ]; then
                echo "--- target dir listing ---"
                ls -la "$(dirname "$EFFECTIVE")" 2>/dev/null || echo "(target dir missing or unreadable)"
              fi
              if [ -n "$ABB_DIR" ]; then
                echo "--- app-builder-bin package dir listing ---"
                ls -la "$ABB_DIR/mac" "$ABB_DIR/linux" "$ABB_DIR/win" 2>/dev/null
                find "$ABB_DIR" -type f 2>/dev/null | sort
              fi
            fi
          } > "$OUT" 2>&1
          cat "$OUT"
          echo ""
          echo "=== before/after comparison ==="
          if [ ! -f "$BEFORE" ]; then
            echo "RESULT: before-build snapshot missing (preflight did not run), comparison skipped"
            echo "RESULT_CLASS: BEFORE_SNAPSHOT_MISSING"
          elif [ ! -f "$OUT" ]; then
            echo "RESULT: after-build snapshot missing (diagnostic command failure) — file state Not Proven by comparison"
            echo "RESULT_CLASS: AFTER_SNAPSHOT_MISSING"
          elif diff -u "$BEFORE" "$OUT" >/dev/null 2>&1; then
            echo "RESULT: no state change before vs after build"
            echo "RESULT_CLASS: SAME"
          else
            echo "RESULT: app-builder-bin state CHANGED during build (see diff above); judge from exists=/size=/file-type=/standalone_help_rc transitions"
            echo "RESULT_CLASS: CHANGED"
          fi
          echo ""
          echo "(read-only diagnostics only; this step never changes the build verdict)"
          exit 0

      # --------------------------------------------------------------
      # 记录制品信息
      # --------------------------------------------------------------
      - name: Record artifact info
        shell: bash
        run: |
          REL="$GITHUB_WORKSPACE/apps/desktop/release"
          echo "=== Build artifacts ==="
          if [ -d "$REL" ]; then
            # RA-30 F2 修复：原 GNU find -printf 在 macOS（BSD find）不支持 → 回退 ls -lh，
            # 只剩 187M/181M 之类人类可读近似值。现统一逐文件 wc -c 输出原始整数 byte 数。
            # 清单先落盘再到当前 shell 循环读取（非管道），exit 1 不会被子 shell 吞掉。
            LIST="$RUNNER_TEMP/artifact-list.txt"
            find "$REL" -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) -print > "$LIST"
            if [ ! -s "$LIST" ]; then
              echo "##[error]release 目录存在但未找到任何候选制品：$REL"
              exit 1
            fi
            while IFS= read -r f || [ -n "$f" ]; do
              if [ -z "$f" ]; then
                continue
              fi
              fpath="$f"
              if command -v cygpath >/dev/null 2>&1; then
                fpath=$(cygpath -u "$f")
              fi
              if [ ! -f "$fpath" ]; then
                echo "##[error]制品缺失：$f"
                exit 1
              fi
              size=$(wc -c < "$fpath" 2>/dev/null | tr -d '[:space:]') || size=""
              if ! printf '%s' "$size" | grep -Eq '^[0-9]+$'; then
                echo "##[error]无法读取制品大小（整数字节）：$f"
                exit 1
              fi
              printf '%s %s\n' "$f" "$size"
            done < "$LIST"
            echo ""
            echo "=== Artifact SHA-256 ==="
            # RA-30 F1 修复：原 `find … | while read f` 未加 -r，POSIX read 会把 Windows
            # 路径中的 "\a"、"\" 等当转义序列消费（Run #7 6 个制品全部退化成
            # "(hash unavailable)"，Run #6 日志 "line 18: D:avideo-…" 可复现）。
            # 现改为 `while IFS= read -r f || [ -n "$f" ]`：反斜杠原样保留、
            # 末行无换行符也处理；并从 "$LIST" 读取以便 exit 1 传播。
            while IFS= read -r f || [ -n "$f" ]; do
              if [ -z "$f" ]; then
                continue
              fi
              fpath="$f"
              if command -v cygpath >/dev/null 2>&1; then
                fpath=$(cygpath -u "$f")
              fi
              # RA-27 修复（Run 109150569887 Windows 第 19 步 exit 127）：
              # 1) 哈希一律走 stdin 重定向（"sha256sum < 文件"，bash 打开文件），
              #    避开 GNU coreutils 对反斜杠/混合分隔符路径的输出转义面——
              #    该 stdin 模式已在第 6 步（Windows FFmpeg 校验）两次 run CI 实证；
              # 2) 不再用 "|| shasum" 作乐观回退（shasum 在 Git Bash 不存在 → 127）。
              # RA-30 收紧：哈希为空或不是 64 位小写十六进制 → exit 1（取消占位伪成功）。
              hash=""
              if command -v sha256sum >/dev/null 2>&1; then
                hash=$(sha256sum < "$fpath" 2>/dev/null | awk '{print $1}') || hash=""
              elif command -v shasum >/dev/null 2>&1; then
                hash=$(shasum -a 256 < "$fpath" 2>/dev/null | awk '{print $1}') || hash=""
              fi
              if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
                echo "##[error]SHA-256 计算失败或结果非法：$f"
                exit 1
              fi
              echo "$(basename "$fpath")  $hash"
            done < "$LIST"
          else
            echo "##[error]release 目录不存在：$REL"
            exit 1
          fi

      # --------------------------------------------------------------
      # 验证 VC_FFMPEG / VC_FFPROBE 路径在打包后有效
      # --------------------------------------------------------------
      - name: Verify bundled FFmpeg paths in resources
        shell: bash
        run: |
          echo "=== Verifying bundled FFmpeg/server in resources (hard check) ==="
          # RA-27 升级（Run 109150569887 实证）：此步骤原版只"列目录"，无任何存在性断言，
          # 在全部 4 平台 extraResources 断链（file source doesn't exist from=apps/api/*）
          # 的情况下依然绿灯（macOS 假阴性）。现按平台定位 resources/server 并硬断言：
          # vns-server* / ffmpeg* / ffprobe* 任一缺失即 exit 1。
          # electron-builder 将 extraResources 复制到：
          #   Windows/Linux: <out>/resources/server ; macOS: <*.app>/Contents/Resources/server
          # RA-28 修正（Run 109157582270 实证）：Windows 上 job-level env "runner_os"（小写名）
          # 与内置 RUNNER_OS（大写名）在 bash 里是两个独立变量（bash 大小写敏感），
          # 但 Windows 进程环境的大小写不敏感会把 runner_os 写入顶掉 RUNNER_OS，导致
          # $RUNNER_OS 展开为空。改用 job 已定义的 runner_os（小写名、取值首字母大写：
          # Windows/macOS/Linux，与本 runner.os 完全一致），分支标签同步大写，
          # 且 4 平台（含 macOS 的 "macOS" 标签）全部命中同一变量同一大小写。
          REL="$GITHUB_WORKSPACE/apps/desktop/release"
          SERVER_RES=""
          case "$runner_os" in
            Windows) SERVER_RES="$REL/win-unpacked/resources/server" ;;
            Linux)   SERVER_RES="$REL/linux-unpacked/resources/server" ;;
            macOS)
              APP_DIR=$(find "$REL" -maxdepth 3 -type d -name "VideoNarrator AI.app" -print -quit 2>/dev/null)
              if [ -n "$APP_DIR" ]; then SERVER_RES="$APP_DIR/Contents/Resources/server"; fi
              ;;
          esac
          echo "Resources dir: ${SERVER_RES:-(unknown)}"
          if [ -z "$SERVER_RES" ] || [ ! -d "$SERVER_RES" ]; then
            echo "##[error]Bundled server/FFmpeg resources directory not found: ${SERVER_RES:-(unknown)}"
            echo "##[error]提示：检查 apps/desktop/electron-builder.yml 的 extraResources from 路径是否指向 ../../services/api/*"
            exit 1
          fi
          ls -la "$SERVER_RES"
          missing=""
          for pat in "vns-server*" "ffmpeg*" "ffprobe*"; do
            if [ -z "$(find "$SERVER_RES" -maxdepth 1 -name "$pat" -print -quit 2>/dev/null)" ]; then
              missing="$missing $pat"
            fi
          done
          if [ -n "$missing" ]; then
            echo "##[error]Missing bundled resource patterns under $SERVER_RES:$missing"
            exit 1
          fi
          # RA-30 F2 修复：逐个输出资源的原始整数 byte 数（wc -c），
          # 不再依赖 ls 的人类可读值；读取失败或非整数 → exit 1，
          # 不把空值/零值/近似值当作精确值。原有存在性硬断言保持不变。
          RES_LIST="$RUNNER_TEMP/resource-list.txt"
          find "$SERVER_RES" -maxdepth 1 -type f \( -name "vns-server*" -o -name "ffmpeg*" -o -name "ffprobe*" \) -print > "$RES_LIST"
          if [ ! -s "$RES_LIST" ]; then
            echo "##[error]No bundled resource files enumerated under $SERVER_RES"
            exit 1
          fi
          while IFS= read -r rf || [ -n "$rf" ]; do
            if [ -z "$rf" ]; then
              continue
            fi
            rpath="$rf"
            if command -v cygpath >/dev/null 2>&1; then
              rpath=$(cygpath -u "$rf")
            fi
            if [ ! -f "$rpath" ]; then
              echo "##[error]Bundled resource missing: $rf"
              exit 1
            fi
            size=$(wc -c < "$rpath" 2>/dev/null | tr -d '[:space:]') || size=""
            if ! printf '%s' "$size" | grep -Eq '^[0-9]+$'; then
              echo "##[error]Cannot read exact byte size: $rf"
              exit 1
            fi
            printf 'SIZE_BYTES %s %s\n' "$size" "$rf"
          done < "$RES_LIST"
          echo "OK: server + ffmpeg/ffprobe resources are bundled under $SERVER_RES"

      # --------------------------------------------------------------
      # 上传候选制品（仅 Actions artifact，不创建 GitHub Release）
      # --------------------------------------------------------------
      - name: Upload candidate artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.label }}
          path: |
            apps/desktop/release/
            ffmpeg-bin-buildconf.txt
            tests-ffmpeg-selfcheck/
          retention-days: 30

      # --------------------------------------------------------------
      # 失败诊断
      # --------------------------------------------------------------
      - name: Save diagnostics on failure
        if: failure()
        shell: bash
        run: |
          echo "=== Failure diagnostics ==="
          echo "Runner:    ${{ runner.os }}"
          echo "Arch:      $runner_arch"
          echo "Commit:    $git_commit"
          echo "Matrix:    ${{ matrix.label }}"
          echo "Step:      $(cat "$GITHUB_STEP_SUMMARY" 2>/dev/null | head -5 || true)"
          echo ""
          echo "=== release dir ==="
          ls -la "$GITHUB_WORKSPACE/apps/desktop/release/" 2>/dev/null || echo "(no release dir)"
          echo ""
          echo "=== ffmpeg-bin dir ==="
          ls -la "$GITHUB_WORKSPACE/services/api/ffmpeg-bin/" 2>/dev/null || echo "(no ffmpeg-bin)"
          echo ""
          echo "=== buildconf (if generated) ==="
          cat "$GITHUB_WORKSPACE/ffmpeg-bin-buildconf.txt" 2>/dev/null | head -40 || echo "(no buildconf file)"

  # ==================================================================
  # 汇总 Job（不阻塞其他 job，仅生成报告）
  # ==================================================================
  summary:
    name: "Candidate Summary"
    needs: candidate-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate summary
        run: |
          {
            echo "# RA-15 候选构建汇总"
            echo ""
            echo "- **Commit**: $(git rev-parse HEAD)"
            echo "- **Date**: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "## 各平台构建状态"
            echo ""
            echo "各 job 状态请查看上方 Actions 运行记录。"
            echo ""
            echo "## 制品说明"
            echo ""
            echo "各平台候选安装包通过 GitHub Actions artifact 上传（保留 30 天）。"
            echo "artifact 名称格式：candidate-<PlatformLabel>"
            echo ""
            echo "包含文件："
            echo "- apps/desktop/release/ 下的安装包（.exe / .dmg / .AppImage / .deb）"
            echo "- ffmpeg-bin-buildconf.txt（各平台 FFmpeg 编译配置）"
            echo "- tests-ffmpeg-selfcheck/（媒体自检生成的测试视频）"
            echo ""
            echo "## 人工安装验收步骤"
            echo ""
            echo "1. 在对应平台机器上下载对应 artifact"
            echo "2. 解压 / 安装"
            echo "3. 确认 resources/server/ 中包含 vns-server、ffmpeg、ffprobe"
            echo "4. 启动应用，验证后端健康检查和视频探测功能"
            echo "5. 记录验收结果至 data/acceptance/report.md"
          } > "$GITHUB_WORKSPACE/candidate-summary.md"
          cat "$GITHUB_WORKSPACE/candidate-summary.md"

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: candidate-summary
          path: candidate-summary.md
          retention-days: 30
