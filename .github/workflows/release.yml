name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt

      # ------------------------------------------------------------------
      # FFmpeg 下载与完整性校验（固定版本 9.0.2 + SHA-256）
      #
      # 各平台资产来源（详见 config/ffmpeg-assets-lock.md）：
      #   Windows x64       → Gyan.dev FFmpeg 9.0.2 essentials
      #   macOS x64         → Martin Riedl FFmpeg 9.0.2 release
      #   macOS arm64       → Martin Riedl FFmpeg 9.0.2 release（原生 Apple Silicon）
      #   Linux x64         → Martin Riedl FFmpeg 9.0.2 release
      #
      # 所有 SHA-256 均预先固定在锁定清单中，CI 不得动态生成预期值。
      # 校验来源为各平台官方 .sha256 端点，非下载文件后自行计算。
      # ------------------------------------------------------------------

      - name: Download FFmpeg (Windows x64)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $ffmpegDir = Join-Path $env:GITHUB_WORKSPACE "services/api/ffmpeg-bin"
          New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          # Gyan.dev FFmpeg 9.0.2 essentials ZIP（固定版本，SHA-256 来自官方 .sha256 端点）
          # SHA-256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba
          # 校验来源: https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip.sha256
          # 记录在: config/ffmpeg-assets-lock.md
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath
          $expected = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          $actual = Get-FileHash -Path $zipPath -Algorithm SHA256 | ForEach-Object { $_.Hash }
          if ($actual -ne $expected) { Write-Error "FFmpeg SHA-256 mismatch: expected $expected, got $actual"; exit 1 }
          Expand-Archive -Path $zipPath -DestinationPath $env:RUNNER_TEMP -Force
          Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ffmpeg-*") -Filter "ffmpeg.exe" -Recurse | Copy-Item -Destination (Join-Path $ffmpegDir "ffmpeg.exe") -Force
          Get-ChildItem -Path (Join-Path $env:RUNNER_TEMP "ffmpeg-*") -Filter "ffprobe.exe" -Recurse | Copy-Item -Destination (Join-Path $ffmpegDir "ffprobe.exe") -Force

      - name: Download FFmpeg (macOS x64)
        if: matrix.platform == 'mac'
        run: |
          ARCH="$(uname -m)"
          if [ "$ARCH" = "arm64" ]; then exit 0; fi  # arm64 由下方步骤处理
          FFMPEG_DIR="$GITHUB_WORKSPACE/services/api/ffmpeg-bin"
          mkdir -p "$FFMPEG_DIR"
          TMP="$RUNNER_TEMP"
          # Martin Riedl FFmpeg 9.0.2 macOS x64（SHA-256 来自官方 .sha256 端点，锁定在 config/ffmpeg-assets-lock.md）
          curl -sL -o "$TMP/ffmpeg.zip" "https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2/ffmpeg.zip"
          FFMPEG_EXPECTED="7c6b4125b191cbf773832dc51f424cf2b6bb7da43007d1e066f95909e47cacd4"
          FFMPEG_ACTUAL=$(shasum -a 256 "$TMP/ffmpeg.zip" | awk '{print $1}')
          if [ "$FFMPEG_ACTUAL" != "$FFMPEG_EXPECTED" ]; then echo "FFmpeg SHA-256 mismatch: expected $FFMPEG_EXPECTED, got $FFMPEG_ACTUAL" >&2; exit 1; fi
          curl -sL -o "$TMP/ffprobe.zip" "https://ffmpeg.martin-riedl.de/download/macos/amd64/1789931006_9.0.2/ffprobe.zip"
          FFPROBE_EXPECTED="2322438ed2f6319a691291b247d09c69dcaa3a982460d1f269a7e1af335cfdfd"
          FFPROBE_ACTUAL=$(shasum -a 256 "$TMP/ffprobe.zip" | awk '{print $1}')
          if [ "$FFPROBE_ACTUAL" != "$FFPROBE_EXPECTED" ]; then echo "FFprobe SHA-256 mismatch: expected $FFPROBE_EXPECTED, got $FFPROBE_ACTUAL" >&2; exit 1; fi
          unzip -q "$TMP/ffmpeg.zip" -d "$TMP/ffmpeg-bin"
          unzip -q "$TMP/ffprobe.zip" -d "$TMP/ffprobe-bin"
          install -m 0755 "$TMP/ffmpeg-bin/ffmpeg" "$FFMPEG_DIR/ffmpeg"
          install -m 0755 "$TMP/ffprobe-bin/ffprobe" "$FFMPEG_DIR/ffprobe"

      - name: Download FFmpeg (macOS arm64)
        if: matrix.platform == 'mac'
        run: |
          ARCH="$(uname -m)"
          if [ "$ARCH" != "arm64" ]; then exit 0; fi  # x64 由上方步骤处理
          FFMPEG_DIR="$GITHUB_WORKSPACE/services/api/ffmpeg-bin"
          mkdir -p "$FFMPEG_DIR"
          TMP="$RUNNER_TEMP"
          # Martin Riedl FFmpeg 9.0.2 macOS arm64（原生 Apple Silicon，SHA-256 锁定在 config/ffmpeg-assets-lock.md）
          curl -sL -o "$TMP/ffmpeg.zip" "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip"
          FFMPEG_EXPECTED="c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924"
          FFMPEG_ACTUAL=$(shasum -a 256 "$TMP/ffmpeg.zip" | awk '{print $1}')
          if [ "$FFMPEG_ACTUAL" != "$FFMPEG_EXPECTED" ]; then echo "FFmpeg SHA-256 mismatch: expected $FFMPEG_EXPECTED, got $FFMPEG_ACTUAL" >&2; exit 1; fi
          curl -sL -o "$TMP/ffprobe.zip" "https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffprobe.zip"
          FFPROBE_EXPECTED="fcbe839537485eaee7a7a8bc5cbc0f90d53617e80943e8a5b2e31cb851197ea6"
          FFPROBE_ACTUAL=$(shasum -a 256 "$TMP/ffprobe.zip" | awk '{print $1}')
          if [ "$FFPROBE_ACTUAL" != "$FFPROBE_EXPECTED" ]; then echo "FFprobe SHA-256 mismatch: expected $FFPROBE_EXPECTED, got $FFPROBE_ACTUAL" >&2; exit 1; fi
          unzip -q "$TMP/ffmpeg.zip" -d "$TMP/ffmpeg-bin"
          unzip -q "$TMP/ffprobe.zip" -d "$TMP/ffprobe-bin"
          install -m 0755 "$TMP/ffmpeg-bin/ffmpeg" "$FFMPEG_DIR/ffmpeg"
          install -m 0755 "$TMP/ffprobe-bin/ffprobe" "$FFMPEG_DIR/ffprobe"

      - name: Download FFmpeg (Linux x64)
        if: matrix.platform == 'linux'
        run: |
          FFMPEG_DIR="$GITHUB_WORKSPACE/services/api/ffmpeg-bin"
          mkdir -p "$FFMPEG_DIR"
          TMP="$RUNNER_TEMP"
          # Martin Riedl FFmpeg 9.0.2 Linux x64（SHA-256 锁定在 config/ffmpeg-assets-lock.md）
          curl -sL -o "$TMP/ffmpeg.zip" "https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2/ffmpeg.zip"
          FFMPEG_EXPECTED="fa8ecf4abbd290d98f7d188b8649cc6b391ae209a98452be955a15aab1909d7f"
          FFMPEG_ACTUAL=$(sha256sum "$TMP/ffmpeg.zip" | awk '{print $1}')
          if [ "$FFMPEG_ACTUAL" != "$FFMPEG_EXPECTED" ]; then echo "FFmpeg SHA-256 mismatch: expected $FFMPEG_EXPECTED, got $FFMPEG_ACTUAL" >&2; exit 1; fi
          curl -sL -o "$TMP/ffprobe.zip" "https://ffmpeg.martin-riedl.de/download/linux/amd64/1789931100_9.0.2/ffprobe.zip"
          FFPROBE_EXPECTED="3f428c49070be3d24ec338602b76d412e401ffcb8a5641ef0e729181a232fc32"
          FFPROBE_ACTUAL=$(sha256sum "$TMP/ffprobe.zip" | awk '{print $1}')
          if [ "$FFPROBE_ACTUAL" != "$FFPROBE_EXPECTED" ]; then echo "FFprobe SHA-256 mismatch: expected $FFPROBE_EXPECTED, got $FFPROBE_ACTUAL" >&2; exit 1; fi
          mkdir -p "$TMP/ffmpeg-bin" "$TMP/ffprobe-bin"
          unzip -q "$TMP/ffmpeg.zip" -d "$TMP/ffmpeg-bin"
          unzip -q "$TMP/ffprobe.zip" -d "$TMP/ffprobe-bin"
          install -m 0755 "$TMP/ffmpeg-bin/ffmpeg" "$FFMPEG_DIR/ffmpeg"
          install -m 0755 "$TMP/ffprobe-bin/ffprobe" "$FFMPEG_DIR/ffprobe"

      - name: Install node dependencies
        run: npm ci

      - name: Install python dependencies
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build web assets
        run: npm run build:web

      - name: Build desktop (Electron 主进程 TypeScript 编译)
        run: npm run build:desktop

      - name: Build standalone server (PyInstaller)
        working-directory: services/api
        run: |
          python -m PyInstaller --clean --noconfirm server.spec
          # 产物：services/api/dist/server/vns-server(.exe)，不含 FFmpeg（由 electron-builder 独立分发）

      - name: Package desktop app
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: video-narrator-${{ matrix.platform }}
          path: apps/desktop/release/*
          retention-days: 14

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    needs: [desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect installers
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" \) \
            -exec cp {} release-assets/ \;
          ls -lh release-assets
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## VideoNarrator AI ${{ github.ref_name }}

            Download the installer for your platform below.

            - **Windows**: `.exe` (NSIS installer) or portable build
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Linux**: `.AppImage` or `.deb`

            The desktop app processes video locally — your files never leave your machine.
            See [README](https://github.com/${{ github.repository }}) for details.
