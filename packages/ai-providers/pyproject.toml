[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-narrator-ai-providers"
version = "1.0.0"
description = "Pluggable AI provider adapters for video understanding, copywriting and text-to-speech"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "VideoNarrator AI Contributors" }]
keywords = ["gemini", "qwen", "doubao", "openai", "tts", "llm"]
dependencies = [
    "httpx>=0.27.0",
    "edge-tts>=6.1.10",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["ai_providers*"]

[tool.ruff]
line-length = 110
