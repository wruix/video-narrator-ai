appId: ai.videonarrator.desktop
productName: VideoNarrator AI
copyright: Copyright © 2026 VideoNarrator AI Contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# 随包携带的本地后端（由 CI 用 PyInstaller 打出后放进 resources/server）
extraResources:
  - from: ../api/dist/server
    to: server
    filter:
      - "**/*"

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: VideoNarrator AI
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.video
  icon: build/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    StartupWMClass: VideoNarrator AI
