appId: ai.videonarrator.desktop
productName: VideoNarrator AI
copyright: Copyright © 2026 VideoNarrator AI Contributors

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# 随包携带的资源（由 CI 准备后放进 resources/）
# 1) PyInstaller 打出的独立后端可执行文件（services/api/dist/vns-server.exe，只含后端，不含 FFmpeg）
# 2) FFmpeg/FFprobe 二进制（CI 从审核来源下载到 services/api/ffmpeg-bin/，作为独立资源分发，不与 PyInstaller 产物耦合，避免重复嵌入）
extraResources:
  - from: ../api/dist
    to: server
    filter:
      - "vns-server*"
  - from: ../api/ffmpeg-bin
    to: server
    filter:
      - "ffmpeg*"
      - "ffprobe*"

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: VideoNarrator AI
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.video
  icon: build/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    StartupWMClass: VideoNarrator AI
