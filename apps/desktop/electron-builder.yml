appId: ai.videonarrator.desktop
productName: VideoNarrator AI
copyright: Copyright © 2026 VideoNarrator AI Contributors

# RA-26 最小修复：打包期 electron-builder 默认在 app 目标目录执行
# "installing production dependencies"（npm install --production / rebuild，见
# app-builder-lib 25.1.8 packager.js installAppDependencies → yarn.js）。
# 本仓库为 npm workspaces 布局，构建工具链（electron / electron-builder /
# builder-util / app-builder-bin）全部位于根 node_modules 的 devDependencies；
# 该生产安装在 apps/desktop 内触发时会把这批 dev 依赖从根 node_modules 剪除，
# electron-builder 进程随后 spawn 已被删除的 app-builder 即报 ENOENT
# （Run #4 三平台实证 + 本地 npm install --omit=dev --dry-run 复现 remove app-builder-bin）。
# 本应用零运行时依赖（dependencies 为空）、无原生模块需要安装或重建，
# npmRebuild: false 直接跳过该步骤（源码路径 "skipped dependencies rebuild"），不影响产物。
npmRebuild: false

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - "!**/*.map"

# 随包携带的资源（由 CI 准备后放进 resources/）
# 1) PyInstaller 打出的独立后端可执行文件（services/api/dist/vns-server.exe，只含后端，不含 FFmpeg）
# 2) FFmpeg/FFprobe 二进制（CI 从审核来源下载到 services/api/ffmpeg-bin/，作为独立资源分发，不与 PyInstaller 产物耦合，避免重复嵌入）
# RA-27 修复：from 相对 apps/desktop 解析（Run 109150569887 四平台日志实证
# "file source doesn't exist from=<ws>/apps/api/{dist,ffmpeg-bin}"），
# ../api/* 曾解析到不存在的 apps/api/*；改为 ../../services/api/* 指向真实产物路径。
extraResources:
  - from: ../../services/api/dist
    to: server
    filter:
      - "vns-server*"
  - from: ../../services/api/ffmpeg-bin
    to: server
    filter:
      - "ffmpeg*"
      - "ffprobe*"

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: VideoNarrator AI
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.video
  icon: build/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  darkModeSupport: true

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  desktop:
    StartupWMClass: VideoNarrator AI
  publish: null
